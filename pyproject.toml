[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-fdr-module-tools"
version = "0.1.0"
description = "A comprehensive suite of CLI tools for managing multi-package repositories"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "GitPython>=3.1.40",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.2",
    "pyyaml>=5.4.0",
    "toml>=0.10.2",
    "semver>=3.0.2",
    "tabulate>=0.9.0",
    "humanize>=4.9.0",
    "tenacity>=8.2.3",
    "colorama>=0.4.4",
    "requests>=2.25.0",
    "PyGithub>=2.1.1",
    "questionary>=2.0.1",
]
authors = [
    {name = "Tsavo Knott", email = "tsavo@pieces.app"},
]
maintainers = [
    {name = "Tsavo Knott", email = "tsavo@pieces.app"},
]
keywords = [
    "git",
    "changelog",
    "release",
    "automation",
    "ai",
    "commit",
    "version",
    "multi-package",
    "monorepo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/open-runtime/runtime_flutter_dart_rust_module_management_tools"
Documentation = "https://github.com/open-runtime/runtime_flutter_dart_rust_module_management_tools/wiki"
Repository = "https://github.com/open-runtime/runtime_flutter_dart_rust_module_management_tools"
Issues = "https://github.com/open-runtime/runtime_flutter_dart_rust_module_management_tools/issues"

[project.scripts]
# Single unified entry point
runtime_fdr_management_tools = "tooling.runtime_fdr_management_tools:cli"

[tool.setuptools]
packages = ["tooling", "tooling.core", "tooling.cli", "tooling.utils", "tooling.tests"]

[tool.setuptools.package-data]
tooling = ["templates/*.j2", "templates/*.html", "config/*.yaml", "config/*.json"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "tooling/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused import
"tests/**" = ["S101"]  # assert used 